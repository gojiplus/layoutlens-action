name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"  # weekly: catch layoutlens/chromium ecosystem drift

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: report.py unit assertions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run assertions
        run: python3 scripts/test_report.py

  defect:
    name: Self-test on planted defects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write  # sticky comment on PRs of this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the action on the defect fixture
        id: scan
        uses: ./
        with:
          sources: fixtures/defect.html
          sarif-upload: "false"
      - name: Assert findings and SARIF contents
        env:
          FINDINGS: ${{ steps.scan.outputs.findings }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -euo pipefail
          echo "findings=$FINDINGS"
          test "$FINDINGS" -ge 5
          # Every planted defect class must be detected — a regression in any
          # single detector must not hide behind the total count.
          for rule in layout/contrast layout/clipping layout/viewport-protrusion \
                      layout/page-overflow layout/truncation layout/target-size \
                      axe/image-alt axe/color-contrast axe/html-has-lang; do
            grep -q "$rule" "$SARIF" || { echo "::error::missing $rule"; exit 1; }
          done
      - name: Validate SARIF against the OASIS 2.1.0 schema
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/sarif-schema.json \
            https://docs.oasis-open.org/sarif/sarif/v2.1.0/os/schemas/sarif-schema-2.1.0.json
          # Python jsonschema, not check-jsonschema: the OASIS schema's own
          # language regex is invalid under strict ECMA regex checking, which
          # check-jsonschema enforces and rejects.
          uv run --no-project --with jsonschema python - <<'PY'
          import json, jsonschema, os
          schema = json.load(open('/tmp/sarif-schema.json'))
          doc = json.load(open(os.environ['SARIF']))
          jsonschema.validate(doc, schema)
          print('SARIF valid against OASIS 2.1.0 schema')
          PY

  clean:
    name: Self-test on the clean control
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the action on the clean fixture
        id: scan
        uses: ./
        with:
          sources: fixtures/clean.html
          sarif-upload: "false"
          pr-comment: "false"
      - name: Assert zero findings
        env:
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          set -euo pipefail
          test "$FINDINGS" -eq 0

  fail-mode:
    name: fail-on findings gates the step
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run with fail-on findings (expected to fail)
        id: scan
        continue-on-error: true
        uses: ./
        with:
          sources: fixtures/defect.html
          fail-on: findings
          sarif-upload: "false"
          pr-comment: "false"
      - name: Assert the step failed
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

  invalid-inputs:
    name: Invalid inputs fail loudly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bogus checks value (expected to fail)
        id: badchecks
        continue-on-error: true
        uses: ./
        with:
          sources: fixtures/clean.html
          checks: bogus
          sarif-upload: "false"
          pr-comment: "false"
      - name: Option-like source (expected to fail)
        id: badsource
        continue-on-error: true
        uses: ./
        with:
          sources: "--help"
          sarif-upload: "false"
          pr-comment: "false"
      - name: Assert both failed
        env:
          C1: ${{ steps.badchecks.outcome }}
          C2: ${{ steps.badsource.outcome }}
        run: |
          set -euo pipefail
          test "$C1" = "failure"
          test "$C2" = "failure"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflow files and the action manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url=$(gh api repos/rhysd/actionlint/releases/latest \
            --jq '.assets[] | select(.name | test("linux_amd64\\.tar\\.gz$")) | .browser_download_url')
          if [ -z "$url" ]; then
            echo "::error::could not resolve an actionlint release asset"
            exit 1
          fi
          curl -sSfL "$url" | tar xz actionlint
          ./actionlint .github/workflows/*.yml

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Zizmor (Actions security lint)
        run: uvx zizmor --min-severity high .github/workflows/ action.yml
